# Construit et publie l'assistant « MBA GED – Ouverture » (Mac universel .dmg, Windows .msi) sur GitHub Releases,
# avec latest.json pour la mise à jour automatique. Déclenché par un tag v* (ex. v0.1.0) ou à la main.
#
# Secrets attendus :
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD   (updater — obligatoires)
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#       (signature + notarisation Mac — facultatifs : sans eux, .dmg non signé = test interne)
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_CLIENT_SECRET, AZURE_TRUSTED_SIGNING_ENDPOINT, AZURE_TRUSTED_SIGNING_ACCOUNT,
#   AZURE_TRUSTED_SIGNING_PROFILE   (signature Windows par Azure Trusted Signing — facultatifs)
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Dépendances
        run: npm ci
      - name: Signature Windows (Azure Trusted Signing)
        if: matrix.platform == 'windows-latest' && env.AZURE_CLIENT_ID != ''
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_PROFILE }}
          files-folder: src-tauri/target/release/bundle
          files-folder-filter: msi,exe
          files-folder-recurse: true
      # Les variables Apple ne sont posées que si les secrets existent : une variable vide ferait échouer la signature.
      - name: Secrets de signature Apple (facultatifs)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          C: ${{ secrets.APPLE_CERTIFICATE }}
          CP: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SI: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          AI: ${{ secrets.APPLE_ID }}
          AP: ${{ secrets.APPLE_PASSWORD }}
          TI: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          [ -n "$C" ] && echo "APPLE_CERTIFICATE=$C" >> "$GITHUB_ENV"
          [ -n "$CP" ] && echo "APPLE_CERTIFICATE_PASSWORD=$CP" >> "$GITHUB_ENV"
          [ -n "$SI" ] && echo "APPLE_SIGNING_IDENTITY=$SI" >> "$GITHUB_ENV"
          [ -n "$AI" ] && echo "APPLE_ID=$AI" >> "$GITHUB_ENV"
          [ -n "$AP" ] && echo "APPLE_PASSWORD=$AP" >> "$GITHUB_ENV"
          [ -n "$TI" ] && echo "APPLE_TEAM_ID=$TI" >> "$GITHUB_ENV"
          echo "signature Apple : $([ -n "$C" ] && echo activée || echo absente, .dmg non signé)"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "MBA GED – Ouverture ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}"
          releaseBody: "Assistant d'ouverture de la GED MBA Group. Mac : MBA-GED-Ouverture.dmg · Windows : MBA-GED-Ouverture.msi."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
      - name: Noms stables des installateurs (liens « latest/download » du dashboard)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -e
          [ -n "$TAG" ] || exit 0
          cd src-tauri/target
          dmg=$(ls */release/bundle/dmg/*.dmg release/bundle/dmg/*.dmg 2>/dev/null | head -1 || true)
          msi=$(ls release/bundle/msi/*.msi 2>/dev/null | head -1 || true)
          if [ -n "$dmg" ]; then cp "$dmg" MBA-GED-Ouverture.dmg; gh release upload "$TAG" MBA-GED-Ouverture.dmg --clobber; fi
          if [ -n "$msi" ]; then cp "$msi" MBA-GED-Ouverture.msi; gh release upload "$TAG" MBA-GED-Ouverture.msi --clobber; fi
